[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compass-finemap"
version = "1.0.0"
description = "Resolution theory, sequence-resolved fine-mapping and conformal credible sets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "pandas>=1.4"]

[tool.setuptools]
packages = ["compass"]
